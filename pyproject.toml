[project]
name = "projet1-irve"
version = "0.1.0"
description = "Exploration du fichier consolidé des bornes de recharge (IRVE) - Projet 1 DIA2"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# E/W : PEP 8 (QC-01) ; F : erreurs (variables inutilisées...) ; I
# N : nommage ; B : bugs fréquents ; UP : syntaxe moderne ; PTH : pathlib
select = ["E", "W", "F", "I", "N", "B", "UP", "PTH"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
"app/dashboard.py" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
